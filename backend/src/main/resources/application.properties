# ── Default profile: in-memory H2 so the app runs with zero local setup ──
# (open http://localhost:8080/h2-console to inspect; JDBC URL below)
spring.datasource.url=jdbc:h2:mem:cityreports;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ── PostgreSQL (the real target). Activate with: --spring.profiles.active=postgres ──
# See application-postgres.properties
