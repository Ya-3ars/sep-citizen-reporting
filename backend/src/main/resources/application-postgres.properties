# PostgreSQL profile — the real database target.
# Run with: mvn spring-boot:run -Dspring-boot.run.profiles=postgres
# (or set spring.profiles.active=postgres)
#
# Create the DB first (see docs/ or the Tech drawer in the project page):
#   CREATE DATABASE cityreports;
#   CREATE USER appuser WITH PASSWORD 'secret';
#   GRANT ALL PRIVILEGES ON DATABASE cityreports TO appuser;

spring.datasource.url=jdbc:postgresql://localhost:5432/cityreports
spring.datasource.username=appuser
spring.datasource.password=secret
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
